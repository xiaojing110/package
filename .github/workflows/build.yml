name: Build Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "目标平台（默认 X86_64）"
        type: choice
        default: x86/64
        options:
          - x86/64
          - x86/generic
          - armsr/armv8
          - armsr/armv7
          - rockchip/armv8
          - bcm27xx/bcm2711
          - bcm27xx/bcm2710
          - mediatek/filogic
          - ramips/mt7621
          - ramips/mt76x8
          - ath79/generic
          - qualcommax/ipq807x
          - qualcommax/ipq60xx
          - sunxi/cortexa8

      openwrt_version:
        description: "OpenWrt 版本（snapshot / 25.12.6 / 24.10.5）"
        type: string
        default: "snapshot"

      mirror:
        description: "下载镜像（留空 = 自动依次尝试官方+国内镜像）"
        type: string
        default: ""

      plugin:
        description: "下拉选择要编译的插件（选 all 则按 preset 批量）"
        type: choice
        default: all
        options:
          - all
          - axonhub
          - chinadns-ng
          - dns2socks
          - gecoosac
          - geo2txt
          - geoview
          - hysteria
          - ipt2socks
          - luci-app-axonhub
          - luci-app-eqosplus
          - luci-app-gecoosac
          - luci-app-homeproxy
          - luci-app-mosdns
          - luci-app-nikki
          - luci-app-passwall
          - luci-app-passwall2
          - luci-app-wolultra
          - luci-theme-material3
          - microsocks
          - mihomo-meta
          - mosdns
          - naiveproxy
          - nikki
          - shadowsocksr-libev
          - simple-obfs
          - sing-box
          - smartdns
          - tcping
          - v2ray-geodata
          - v2ray-plugin
          - xray-core
          - xray-plugin
          - dae-box
          - luci-app-dae-box

      preset:
        description: "plugin=all 时按组编译"
        type: choice
        default: all
        options:
          - all
          - luci-app
          - proxy-core
          - passwall
          - nikki
          - mosdns
          - theme
          - custom

      packages:
        description: "plugin=all 且 preset=custom 时使用：包名，空格或逗号分隔"
        type: string
        default: ""

      exclude:
        description: "默认不编译的包（空格/逗号分隔）。在 plugin 下拉里点名、或 custom 里写包名时不受此限"
        type: string
        default: "axonhub luci-app-axonhub dae-box luci-app-dae-box smartdns"

      upload_all:
        description: "上传全部产物（含 -dbg / -dev），否则只上传主包"
        type: boolean
        default: false

      build_mode:
        description: "编译范围"
        type: choice
        default: full
        options:
          - full
          - new-commits

      upload_release:
        description: "把编译产物上传到 GitHub Releases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # 所有输入只在这里出现一次，后续步骤一律用 $PLATFORM / $OWT_VER … 引用
    env:
      PLATFORM: ${{ inputs.platform }}
      OWT_VER: ${{ inputs.openwrt_version }}
      PLUGIN: ${{ inputs.plugin }}
      PRESET: ${{ inputs.preset }}
      CUSTOM_PKGS: ${{ inputs.packages }}
      EXCLUDE_PKGS: ${{ inputs.exclude }}
      UPLOAD_ALL: ${{ inputs.upload_all }}
      BUILD_MODE: ${{ inputs.build_mode }}
      UPLOAD_RELEASE: ${{ inputs.upload_release }}
      MIRROR: ${{ inputs.mirror }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # new-commits 模式要 git diff 旧提交..HEAD，必须拿完整历史
          fetch-depth: 0
          fetch-tags: true

      # ---- 先解析包列表：错了就立刻失败，别浪费十分钟下 SDK ----
      - name: Resolve package list
        run: |
          set -euo pipefail
          # 仓库根目录下所有含 Makefile 的目录 = 可编译的包
          ALL=$(find . -maxdepth 2 -name Makefile -not -path './.git/*' \
                | sed 's|^\./||; s|/Makefile$||' | sort | tr '\n' ' ')
          echo "仓库内全部包: $ALL"
          # 存下来给 Collect artifacts 做白名单：只提交仓库内的插件
          echo "$ALL" > repopkgs.txt

          # ---- 先定 LIST ----
          # 显式点名（下拉选中单个包 / custom 里写包名）→ 不受 exclude 影响
          # 批量（plugin=all 且 preset≠custom）→ 再减去 exclude
          SKIP_EXCLUDE="no"
          if [ "${PLUGIN:-all}" != "all" ]; then
            LIST="$PLUGIN"
            SKIP_EXCLUDE="yes"
            echo "→ 下拉选中单个插件: $PLUGIN（不套 exclude）"
          else
            case "${PRESET:-all}" in
              all)
                LIST="$ALL" ;;
              luci-app)
                LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-app-' | tr '\n' ' ') ;;
              theme)
                LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-theme-' | tr '\n' ' ') ;;
              proxy-core)
                LIST="xray-core xray-plugin v2ray-plugin sing-box hysteria \
                      naiveproxy chinadns-ng geoview microsocks tcping simple-obfs \
                      mihomo-meta mosdns geo2txt dae-box" ;;
              passwall)
                LIST="luci-app-passwall xray-core xray-plugin v2ray-plugin sing-box hysteria \
                      shadowsocksr-libev naiveproxy chinadns-ng \
                      dns2socks geoview microsocks tcping simple-obfs ipt2socks v2ray-geodata \
                      smartdns" ;;
              nikki)
                LIST="luci-app-nikki nikki mihomo-meta" ;;
              mosdns)
                LIST="luci-app-mosdns mosdns geo2txt" ;;
              custom)
                LIST=$(echo "${CUSTOM_PKGS:-}" | tr ',' ' ')
                SKIP_EXCLUDE="yes"
                echo "→ custom 显式点名（不套 exclude）" ;;
              *)
                echo "::error::未知 preset: $PRESET"; exit 1 ;;
            esac
          fi

          # ---- 减去默认不编译的包（只对批量 preset 生效）----
          if [ "$SKIP_EXCLUDE" = "no" ] && [ -n "${EXCLUDE_PKGS:-}" ]; then
            EX=$(echo "$EXCLUDE_PKGS" | tr ',' ' ')
            echo "→ 默认不编译: $EX"
            for e in $EX; do
              NL=""
              for p in $LIST; do
                if [ "$p" != "$e" ]; then NL="$NL $p"; fi
              done
              LIST="$NL"
            done
          fi

          # ---- 去重 + 校验存在 ----
          RES=""
          for p in $LIST; do
            if [ ! -d "$p" ] || [ ! -f "$p/Makefile" ]; then
              echo "::warning::跳过不存在的包: $p"
              continue
            fi
            case " $RES " in *" $p "*) continue ;; esac
            RES="$RES $p"
          done
          RES=$(echo "$RES" | xargs)

          if [ -z "$RES" ]; then
            echo "::error::解析出的包列表为空（plugin=${PLUGIN:-all} preset=${PRESET:-all} exclude=${EXCLUDE_PKGS:-无}）"
            exit 1
          fi

          echo "→ 将编译: $RES"
          echo "$RES" > pkglist.txt
          cat pkglist.txt

      # ---- build_mode=new-commits：只编新提交改动的包 ----
      - name: Resolve build scope (new-commits)
        run: |
          set -uo pipefail
          . ./sdk.env 2>/dev/null || TAG="${OWT_VER}-${PLATFORM%%/*}-${PLATFORM##*/}"
          REL_TAG="packages-${TAG}"

          if [ "${BUILD_MODE:-full}" != "new-commits" ]; then
            echo "→ 完整编译（build_mode=${BUILD_MODE:-full}）"
            exit 0
          fi

          # 上次构建到哪个 commit —— 从**最新**那个 packages-* Release 里取
          # （每次编译都新建 Release，所以不能再用固定 tag）
          LAST=""
          if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
            LAST_REL=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                       --jq '[.[] | select(.tag_name | startswith("packages-"))][0].tag_name' 2>/dev/null || true)
            if [ -n "$LAST_REL" ]; then
              echo "→ 最近一次构建 Release: $LAST_REL"
              gh release download "$LAST_REL" -p 'build-info.txt' -D /tmp/bi >/dev/null 2>&1 || true
              [ -f /tmp/bi/build-info.txt ] && LAST=$(sed -n 's/^commit=//p' /tmp/bi/build-info.txt | head -1)
            fi
          fi
          if [ -z "$LAST" ]; then
            LAST=$(curl -sL --fail --retry 2 \
                    "https://github.com/${GITHUB_REPOSITORY}/releases/download/${REL_TAG}/build-info.txt" \
                    2>/dev/null | sed -n 's/^commit=//p' | head -1 || true)
          fi

          if [ -z "$LAST" ]; then
            echo "→ 找不到上次构建记录（首次构建？）→ 退回完整编译"
            exit 0
          fi
          if ! git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            echo "→ 上次 commit $LAST 不在本地历史里 → 退回完整编译"
            exit 0
          fi

          echo "→ 上次构建 commit: $LAST"
          echo "→ 本次 HEAD:       $(git rev-parse --short HEAD)"

          # 取改动到的第一级目录（即包目录），再跟已解析的列表求交集
          CHANGED=$(git diff --name-only "$LAST"..HEAD | cut -d/ -f1 | sort -u | tr '\n' ' ')
          echo "→ 新提交改动的顶层条目: ${CHANGED:-<无>}"

          NEW=""
          for p in $(cat pkglist.txt); do
            case " $CHANGED " in *" $p "*) NEW="$NEW $p" ;; esac
          done
          NEW=$(echo "$NEW" | xargs)

          if [ -z "$NEW" ]; then
            echo "::notice::新提交没有改动任何待编译的包，本次无需编译"
            echo "skip=true" > build-scope.env
            : > pkglist.txt
            exit 0
          fi

          echo "→ new-commits 精简后: $NEW"
          echo "$NEW" > pkglist.txt
          echo "skip=false" > build-scope.env

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget zstd curl jq

      # ---- 按需自动补全宿主工具链 ----
      # axonhub 的前端要 Node.js + pnpm 才能编（Makefile 里 pnpm install / pnpm run build）
      - name: Install host toolchains (auto)
        run: |
          set -uo pipefail
          LIST=$(cat pkglist.txt 2>/dev/null || echo "")

          if echo " $LIST " | grep -qE '[[:space:]](axonhub|luci-app-axonhub)[[:space:]]'; then
            echo "→ 检测到 axonhub：安装 Node.js + npm + pnpm"
            sudo apt-get install -y -qq nodejs npm
            sudo npm install -g pnpm
            echo "  node  : $(node -v 2>/dev/null || echo 未装上)"
            echo "  npm   : $(npm -v 2>/dev/null || echo 未装上)"
            echo "  pnpm  : $(pnpm -v 2>/dev/null || echo 未装上)"
          else
            echo "→ 本次不需要 Node.js / pnpm"
          fi

          # 顺手确认其它常用宿主工具存在，缺了就补
          for t in python3 rsync zstd; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "→ 缺少 $t，自动安装"
              sudo apt-get install -y -qq "$t" || true
            fi
          done

      - name: Resolve SDK
        run: |
          set -euo pipefail
          TARGET="${PLATFORM%%/*}"
          SUBTARGET="${PLATFORM##*/}"

          if [ "$OWT_VER" = "snapshot" ]; then
            SUBPATH="snapshots"
          else
            SUBPATH="releases/${OWT_VER}"
          fi

          # 镜像列表：官方优先，后面是国内镜像兜底
          # （downloads.openwrt.org 会偶发 502，实测 tuna 有完整 releases 树）
          if [ -n "${MIRROR:-}" ]; then
            MIRRORS="$MIRROR"
          else
            MIRRORS="https://downloads.openwrt.org \
                     https://mirrors.tuna.tsinghua.edu.cn/openwrt \
                     https://mirrors.ustc.edu.cn/openwrt"
          fi

          echo "→ 目标: ${SUBPATH}/targets/${TARGET}/${SUBTARGET}"

          SDK_URL=""; SDK_FILE=""; TRIED=""
          for M in $MIRRORS; do
            BASE="$M/${SUBPATH}/targets/${TARGET}/${SUBTARGET}"
            TRIED="$TRIED $BASE/"
            for attempt in 1 2 3; do
              # 注意：不能用 head -1（会 SIGPIPE，pipefail 下拖垮整条管道），用 sed -n 1p
              LISTING=$(curl -sL --retry 3 --retry-delay 3 \
                         --connect-timeout 20 --max-time 90 "$BASE/" 2>/dev/null || true)
              SDK_FILE=$(printf '%s\n' "$LISTING" \
                         | grep -oE 'openwrt-sdk-[^"<]+\.Linux-x86_64\.tar\.(zst|xz)' \
                         | sort -u | sed -n '1p' || true)
              if [ -n "$SDK_FILE" ]; then break; fi
              echo "  ⚠️ $BASE 没取到 SDK（第 ${attempt} 次，HTTP 可能 5xx）"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
            done
            if [ -n "$SDK_FILE" ]; then SDK_URL="$BASE/$SDK_FILE"; break; fi
          done

          if [ -z "$SDK_URL" ]; then
            echo "::error::所有镜像都没拿到 OpenWrt SDK"
            echo "—— 试过的地址 ——"
            for t in $TRIED; do echo "  $t"; done
            echo "—— 可能原因 ——"
            echo "1) downloads.openwrt.org 正在故障（实测会返 502），稍后重试或用 mirror 输入指定镜像"
            echo "2) 平台 target/subtarget 名字不对（旧名 ipq807x 已并入 qualcommax，用 qualcommax/ipq807x）"
            echo "3) 该版本没有这个平台的预编译 SDK（snapshot 不一定全，可试 25.12.6）"
            exit 1
          fi

          echo "→ 命中镜像: ${BASE}"
          echo "→ SDK:      ${SDK_FILE}"
          {
            echo "SDK_URL=${SDK_URL}"
            echo "SDK_FILE=${SDK_FILE}"
            echo "TARGET=${TARGET}"
            echo "SUBTARGET=${SUBTARGET}"
            echo "TAG=${OWT_VER}-${TARGET}-${SUBTARGET}"
          } > sdk.env
          cat sdk.env

      - name: Download & extract SDK
        run: |
          set -euo pipefail
          . ./sdk.env
          echo "→ 下载 $SDK_URL"
          # 分片重试：官方站点偶发 502，--retry 只对部分错误生效，这里显式重试
          ok=0
          for i in 1 2 3 4 5; do
            if curl -sL --fail --retry 3 --retry-delay 5 \
                 --connect-timeout 30 --max-time 1800 \
                 -o sdk-archive "$SDK_URL"; then ok=1; break; fi
            echo "⚠️ 第 $i 次下载失败，$((i * 15)) 秒后重试…"
            rm -f sdk-archive
            sleep $((i * 15))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::SDK 下载失败（多次重试无效）: $SDK_URL"
            exit 1
          fi
          ls -lh sdk-archive
          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf sdk-archive -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk-archive -C sdk --strip-components=1 ;;
            *) echo "::error::未知 SDK 归档格式: $SDK_FILE"; exit 1 ;;
          esac
          ls sdk | head

      - name: Update feeds
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: Replace golang with latest from openwrt/packages
        if: env.OWT_VER != 'snapshot'
        run: |
          set -euo pipefail
          cd sdk

          TMP=$(mktemp -d)
          echo "→ 拉取 openwrt/packages 最新 lang/golang（仅 release SDK 需要）"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/openwrt/packages.git "$TMP/packages"
          (
            cd "$TMP/packages"
            git sparse-checkout set lang/golang
          )

          # 删掉 SDK 里原先整份 golang
          echo "→ 删除旧 golang 目录"
          rm -rf feeds/packages/lang/golang
          find package/feeds -name 'golang*' -exec rm -rf {} + 2>/dev/null || true
          find package/feeds -path '*/lang/golang*' -exec rm -rf {} + 2>/dev/null || true

          # 整份拷贝官方最新 golang 文件夹
          mkdir -p feeds/packages/lang
          cp -a "$TMP/packages/lang/golang" feeds/packages/lang/
          echo "→ 已替换为官方最新 golang"

          if [ -f feeds/packages/lang/golang/golang1.27/Makefile ]; then
            echo "→ 检测到 golang1.27："
            grep -E 'GO_VERSION_MAJOR_MINOR|GO_VERSION_PATCH|PKG_HASH' \
              feeds/packages/lang/golang/golang1.27/Makefile | head -5
          fi
          if [ -f feeds/packages/lang/golang/golang-values.mk ]; then
            grep 'GO_DEFAULT_VERSION' feeds/packages/lang/golang/golang-values.mk || true
          fi

          ./scripts/feeds install -a -f -p packages 2>/dev/null || true
          ./scripts/feeds install -f golang golang1.27 2>/dev/null || true

          rm -rf "$TMP"
          echo "→ golang 替换完成（snapshot 会跳过本步骤）"

      - name: Inject packages into SDK
        run: |
          set -euo pipefail
          cd sdk

          # 清掉 feed 里的同名包，保证用的是**本仓库**的版本
          #   两层都要清，否则 make 仍会扫到 feed 那份，报 "redefining package" 或直接用错：
          #   1) package/feeds/<feed>/<name>  —— feeds install 装出来的**符号链接**
          #      （注意是链接，不能用 -type d 过滤，否则删不掉）
          #   2) feeds/<feed>/<cat>/<name>   —— feed 源目录本身
          #      （如 feeds/packages/net/sing-box，必须删掉才能真正切到本仓库的 sing-box）
          purge_feed_pkg() {
            local n="$1"
            find package/feeds -name "$n" -exec rm -rf {} + 2>/dev/null || true
            find feeds -mindepth 2 -maxdepth 4 -name "$n" -exec rm -rf {} + 2>/dev/null || true
          }

          for p in $(cat ../pkglist.txt); do
            purge_feed_pkg "$p"
            rm -rf "package/$p"
            cp -a "../$p" "package/$p"
            echo "→ package/$p  （已清掉 feed 同名包）"
          done

          echo ""
          echo "→ 自动补全缺失的构建依赖"
          if [ -f ../tools/auto-deps.sh ]; then
            bash ../tools/auto-deps.sh ../pkglist.txt || true
          else
            echo "  （找不到 tools/auto-deps.sh，跳过）"
          fi

          echo ""
          echo "→ 专项检查：OpenWrt 自带的 sing-box 是否已清干净"
          if [ -e feeds/packages/net/sing-box ]; then
            echo "  ❌ feeds/packages/net/sing-box 仍存在"
          else
            echo "  ✅ feeds/packages/net/sing-box 已删除"
          fi
          LEFT=$(find package/feeds feeds -name 'sing-box' 2>/dev/null | sort || true)
          if [ -n "$LEFT" ]; then
            echo "  ❌ 仍有残留："; echo "$LEFT" | sed 's/^/     /'
          else
            echo "  ✅ 扫描路径里只剩本仓库的 sing-box"
          fi
          ls -ld package/sing-box 2>/dev/null | sed 's/^/  本仓库 → /'

          echo ""
          echo "→ 通用校验：注入的每个包只应存在一份"
          for p in $(cat ../pkglist.txt); do
            N=$(find package feeds -name "$p" 2>/dev/null | wc -l)
            if [ "$N" -gt 1 ]; then
              echo "  ⚠️ $p 发现 $N 份："
              find package feeds -name "$p" 2>/dev/null | sed 's/^/     /'
            fi
          done
          echo "  （无 ⚠️ 即全部唯一）"

          echo ""
          echo "→ package/ 下已注入:"
          find package -maxdepth 1 -mindepth 1 -type d | sort | sed 's/^/  /'

      - name: Build
        run: |
          set -uo pipefail

          # new-commits 模式下若无改动，直接跳过
          if [ -f build-scope.env ] && grep -q '^skip=true' build-scope.env; then
            echo "→ 没有新改动，跳过编译"
            : > build-result.txt
            exit 0
          fi
          if [ ! -s pkglist.txt ]; then
            echo "→ 包列表为空，跳过编译"
            : > build-result.txt
            exit 0
          fi

          cd sdk

          if ! make defconfig; then
            echo "::error::make defconfig 失败"
            exit 1
          fi

          mkdir -p ../build-logs
          : > ../build-result.txt

          # 缺什么工具就装什么，然后重试一次
          auto_heal() {
            local log="$1"
            if grep -qiE 'pnpm(:| ).*(not found|command not found)|pnpm: not found' "$log"; then
              echo "  ↳ 日志显示缺 pnpm，自动安装后重试"
              sudo npm install -g pnpm >/dev/null 2>&1 || npm install -g pnpm >/dev/null 2>&1 || true
              return 0
            fi
            if grep -qiE 'node(:| ).*(not found|command not found)|nodejs.*not found' "$log"; then
              echo "  ↳ 日志显示缺 node，自动安装后重试"
              sudo apt-get install -y -qq nodejs npm >/dev/null 2>&1 || true
              sudo npm install -g pnpm >/dev/null 2>&1 || true
              return 0
            fi
            if grep -qiE 'cargo(:| ).*(not found|command not found)|rustc.*not found' "$log"; then
              echo "  ↳ 日志显示缺 Rust，自动安装后重试"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y >/dev/null 2>&1 || true
              return 0
            fi
            if grep -qiE 'No rule to make target.*node-pnpm|node-pnpm/host' "$log"; then
              echo "  ↳ 缺 node-pnpm 宿主包，重新生成存根后重试"
              ( cd .. && bash tools/auto-deps.sh pkglist.txt ) >/dev/null 2>&1 || true
              return 0
            fi
            return 1
          }

          for p in $(cat ../pkglist.txt); do
            echo "=============================================================="
            echo "▶ 编译 $p"
            echo "=============================================================="

            LOG="../build-logs/$p.log"
            TGT="$p"

            # make 的 target 用的是 build target 名，通常是目录名；
            # 但少数包 PK_NAME 与目录不一致（如 xray-core 目录 vs PKG_NAME=Xray-core），
            # 拿到 "No rule to make target" 时改用 PKG_NAME 重试。
            if make "package/$TGT/compile" -j"$(nproc)" V=s > "$LOG" 2>&1; then
              echo "✅ $p"
              echo "ok   $p" >> ../build-result.txt
              continue
            fi

            PKGNAME=$(sed -nE 's/^[[:space:]]*PKG_NAME[[:space:]]*[:?+]?=[[:space:]]*//p' \
                        "package/$p/Makefile" | head -1)
            # 派生式（如 luci-app-eqosplus 的 PKG_NAME:=luci-app-$(THEME_NAME)）
            # 含 $ 不能当 make target，直接放弃回退
            case "$PKGNAME" in *'$'*) PKGNAME='' ;; esac

            if [ -n "$PKGNAME" ] && [ "$PKGNAME" != "$p" ] \
               && grep -q 'No rule to make target' "$LOG"; then
              echo " ↳ 目录名没命中，改用 PKG_NAME=$PKGNAME 重试"
              TGT="$PKGNAME"
              if make "package/$TGT/compile" -j"$(nproc)" V=s >> "$LOG" 2>&1; then
                echo "✅ $p (as $PKGNAME)"
                echo "ok   $p" >> ../build-result.txt
                continue
              fi
            fi

            # 自动补依赖后重试一次
            if auto_heal "$LOG"; then
              if make "package/$TGT/compile" -j"$(nproc)" V=s >> "$LOG" 2>&1; then
                echo "✅ $p（自动补依赖后）"
                echo "ok   $p" >> ../build-result.txt
                continue
              fi
            fi

            echo "❌ $p  （末尾日志如下）"
            tail -40 "$LOG" || true
            echo "fail $p" >> ../build-result.txt
          done

          echo "=============================================================="
          echo "结果:"
          cat ../build-result.txt

          # 有失败就让 job 失败（产物与日志仍会因 if:always() 上传）
          if grep -q '^fail ' ../build-result.txt; then
            echo "::error::有包编译失败，详见 build-logs 产物"
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          # 前面步骤失败时 sdk.env 可能不存在，优雅降级
          if [ -f ./sdk.env ]; then . ./sdk.env; else TAG="unknown"; fi

          OUT="artifacts/${TAG}"
          mkdir -p "$OUT"

          # 只保留**本仓库里的插件**；feed 依赖顺带编出来的（coreutils / golang / lua…）
          # 不属于本仓库，一律丢弃，不打包也不上传 Release。
          REPOPKGS=$(cat repopkgs.txt 2>/dev/null || echo "")
          in_repo() {
            local base="$1" d b pfx
            [ -z "$REPOPKGS" ] && return 0   # 白名单缺失时保守保留
            for d in $REPOPKGS; do
              # 1) 本体包：xray-core / xray-core-dbg / luci-app-passwall …
              case "$base" in "$d"|"$d"-*) return 0 ;; esac
              # 2) **语言包**：luci-i18n-<basename>-<lang>
              #    luci.mk 生成时把 luci-app- / luci-theme- 前缀去掉，
              #    所以 luci-app-passwall2 → luci-i18n-passwall2-zh-cn，
              #    只用包目录名做前缀匹配会把语言包全挡掉。
              b="${d#luci-app-}"
              b="${b#luci-theme-}"
              pfx="luci-i18n-${b}"
              case "$base" in "$pfx"|"$pfx"-*) return 0 ;; esac
              # 3) 再兼客一下用完整包名作前缀的写法
              pfx="luci-i18n-${d}"
              case "$base" in "$pfx"|"$pfx"-*) return 0 ;; esac
            done
            return 1
          }
          pkgname_of() {
            local b
            b=$(basename "$1")
            b="${b%.ipk}"; b="${b%.apk}"
            printf '%s' "${b%%_*}"     # 去掉 _<版本>_<架构>
          }

          DROPPED=0; KEPT=0
          for f in $(find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null); do
            BASE=$(pkgname_of "$f")
            if ! in_repo "$BASE"; then
              DROPPED=$((DROPPED + 1))
              continue
            fi
            case "$UPLOAD_ALL" in
              true) cp -a "$f" "$OUT/" ;;
              *) case "$BASE" in
                   *-dbg|*-dev|*-src) continue ;;
                 esac
                 cp -a "$f" "$OUT/" ;;
            esac
            KEPT=$((KEPT + 1))
          done

          echo "→ 保留本仓库插件 $KEPT 个，丢弃非本仓库依赖包 $DROPPED 个"

          echo "→ 产物:"
          ls -lh "$OUT" | head -60 || true
          COUNT=$(find "$OUT" -type f | wc -l)
          echo "→ 共 $COUNT 个包"
          [ "$COUNT" -gt 0 ] || echo "::warning::没有收集到任何产物"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 编译结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 平台 | \`$PLATFORM\` |"
            echo "| OpenWrt | \`$OWT_VER\` |"
            echo "| preset | \`$PRESET\` |"
            echo ""
            echo "### 各包结果"
            echo '```'
            cat build-result.txt 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      # ---- 上传到 GitHub Releases（滚动发布，同名 tag 每次覆盖）----
      - name: Upload to Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${UPLOAD_RELEASE:-true}" != "true" ]; then echo "→ upload_release=false，跳过"; exit 0; fi
          if [ -f ./sdk.env ]; then . ./sdk.env; else TAG="${OWT_VER}-${PLATFORM%%/*}-${PLATFORM##*/}"; fi

          OUT="artifacts/${TAG}"
          N=$(find "$OUT" -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | wc -l)
          if [ "$N" -eq 0 ]; then
            echo "::notice::没有产物，跳过 Release 上传"
            exit 0
          fi

          # ---- 每次编译都新建一个 Release，不堆在同一个里 ----
          #   标题带日期（YY.MM.DD），tag 再加时分保证同日多次编译也不冲突
          DATE=$(date +%-y.%-m.%-d)          # 26.10.29
          STAMP=$(date +%Y%m%d-%H%M)         # 20261029-0043
          REL_TAG="packages-${TAG}-${STAMP}"
          REL_TITLE="OpenWrt 插件包 · ${PLATFORM} · ${OWT_VER} ${DATE}"

          # ---- 中文构建说明 ----
          {
            echo "# OpenWrt 插件包构建说明"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
            echo "| 目标平台 | \`${PLATFORM:-未知}\` |"
            echo "| OpenWrt 版本 | \`${OWT_VER:-未知}\` |"
            echo "| 编译范围 | \`${BUILD_MODE:-full}\` |"
            echo "| 插件选择 | plugin=\`${PLUGIN:-all}\` / preset=\`${PRESET:-all}\` |"
            echo ""
            echo "**构建提交**: \`$(git rev-parse HEAD)\`"
            echo ""
            echo "## 编译结果"
            echo '```'
            cat build-result.txt 2>/dev/null || echo "（无）"
            echo '```'
            echo ""
            echo "## 安装说明"
            echo '```'
            echo "opkg install ./*.ipk        # OpenWrt 24.x 及以前"
            echo "apk add ./*.apk             # OpenWrt 25.x"
            echo '```'
            echo ""
            echo "> 说明：本产物只包含**本仓库内的插件**及其语言包，"
            echo "> feed 依赖（coreutils / golang / lua 等）请自行通过 feeds 安装。"
          } > build-info.txt

          # 机器可读行，供 new-commits 模式 diff 用（追加在末尾，不影响正文）
          echo "commit=$(git rev-parse HEAD)" >> build-info.txt

          echo "→ 新建 Release: $REL_TAG"
          echo "→ 标题: $REL_TITLE   （$N 个包）"
          gh release create "$REL_TAG" "$OUT"/* build-info.txt \
            --title "$REL_TITLE" \
            --notes-file build-info.txt
          echo "→ 已发布到 Releases/${REL_TAG}"
